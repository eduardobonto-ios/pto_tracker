# Replaces vercel.json's catch-all rewrite: this is a client-routed SPA, so
# every unknown path must serve index.html rather than 404.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable; index.html must never be cached or clients
  # keep loading an old bundle that points at deleted asset filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
